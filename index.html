<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PONG — Jugador A vs Jugador B</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;900&display=swap');

  :root {
    --bg: #0a0a0f;
    --adrian: #00ffcc;
    --luis: #ff3366;
    --ball: #ffffff;
    --dim: rgba(255,255,255,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ── PANTALLA DE SELECCIÓN ── */
  #screen-select {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  #screen-select h1 {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: clamp(2rem, 8vw, 4rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--adrian), var(--luis));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #secret-p {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  #screen-select p {
    color: rgba(255,255,255,0.4);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
  }

  .btn-players {
    display: flex;
    gap: 24px;
  }

  .btn-player {
    padding: 18px 44px;
    border: 2px solid;
    background: transparent;
    font-family: 'Orbitron', monospace;
    font-size: 1.1rem;
    font-weight: 900;
    letter-spacing: 0.15em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .btn-player::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn-player:hover::before { opacity: 0.15; }
  .btn-player:hover { transform: translateY(-2px); }

  #btn-adrian {
    border-color: var(--adrian);
    color: var(--adrian);
    text-shadow: 0 0 10px var(--adrian);
    box-shadow: 0 0 20px rgba(0,255,204,0.2);
  }
  #btn-adrian::before { background: var(--adrian); }
  #btn-adrian:hover { box-shadow: 0 0 30px rgba(0,255,204,0.5); }

  #btn-luis {
    border-color: var(--luis);
    color: var(--luis);
    text-shadow: 0 0 10px var(--luis);
    box-shadow: 0 0 20px rgba(255,51,102,0.2);
  }
  #btn-luis::before { background: var(--luis); }
  #btn-luis:hover { box-shadow: 0 0 30px rgba(255,51,102,0.5); }

  /* ── PANTALLA DE ESPERA ── */
  #screen-wait {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    text-align: center;
  }

  #screen-wait h2 {
    font-family: 'Orbitron', monospace;
    font-size: 1.4rem;
    letter-spacing: 0.15em;
  }

  .pulse {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--adrian);
    animation: pulse 1s infinite;
    margin: 0 auto;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.6); }
  }

  /* ── PANTALLA DE JUEGO ── */
  #screen-game {
    display: none;
    flex-direction: column;
    width: 100%;
    height: 100dvh;
    position: relative;
  }

  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    flex-shrink: 0;
  }

  .hud-name { font-weight: 900; font-size: 0.85rem; }
  .hud-score { font-size: 2rem; font-weight: 900; }
  #hud-top { color: var(--luis); }
  #hud-bottom { color: var(--adrian); }
  #hud-center { color: rgba(255,255,255,0.3); font-size: 0.7rem; }

  canvas {
    flex: 1;
    display: block;
    width: 100%;
    touch-action: none;
  }

  /* ── PANTALLA FIN ── */
  #screen-end {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    text-align: center;
  }

  #screen-end h2 {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: clamp(1.5rem, 6vw, 3rem);
    letter-spacing: 0.2em;
  }

  #btn-restart {
    padding: 14px 36px;
    border: 2px solid rgba(255,255,255,0.4);
    background: transparent;
    font-family: 'Orbitron', monospace;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    color: #fff;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  #btn-restart:hover {
    background: rgba(255,255,255,0.1);
    border-color: #fff;
  }

  /* línea central */
  .center-line {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: 1px;
    background: repeating-linear-gradient(90deg,
      rgba(255,255,255,0.15) 0px, rgba(255,255,255,0.15) 8px,
      transparent 8px, transparent 18px);
    pointer-events: none;
  }

  /* ── OVERLAY DE PAUSA / SEGURO DE SINCRONÍA ── */
  #pause-overlay {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: rgba(10,10,15,0.78);
    backdrop-filter: blur(2px);
    z-index: 5;
    pointer-events: none;
    text-align: center;
  }
  #pause-overlay.active { display: flex; }
  #pause-overlay .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #ffcc00;
    animation: pulse 1s infinite;
  }
  #pause-overlay span {
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    color: #ffcc00;
    text-shadow: 0 0 10px #ffcc00;
  }
  #pause-overlay small {
    color: rgba(255,255,255,0.4);
    font-size: 0.7rem;
    letter-spacing: 0.05em;
  }

  /* ── PANTALLA DE LOG DE DEPURACIÓN ── */
  #screen-log {
    display: none;
    flex-direction: column;
    width: 100%;
    height: 100dvh;
    background: #05050a;
  }
  #log-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.6);
  }
  #log-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  #log-actions button {
    padding: 8px 10px;
    border: 1px solid rgba(255,255,255,0.3);
    background: transparent;
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #log-actions button:disabled { opacity: 0.6; cursor: default; }
  #log-actions button:active { background: rgba(255,255,255,0.15); }
  #log-text {
    flex: 1;
    width: 100%;
    background: #05050a;
    color: #7CFC9A;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.68rem;
    line-height: 1.5;
    padding: 12px 14px;
    border: none;
    outline: none;
    resize: none;
    white-space: pre;
    -webkit-user-select: text;
    user-select: text;
  }
</style>
</head>
<body>

<!-- SELECCIÓN -->
<div id="screen-select">
  <h1><span id="secret-p">P</span>ONG</h1>
  <p>¿QUIÉN ERES?</p>
  <div class="btn-players">
    <button class="btn-player" id="btn-adrian">JUGADOR A</button>
    <button class="btn-player" id="btn-luis">JUGADOR B</button>
  </div>
</div>

<!-- ESPERA -->
<div id="screen-wait">
  <h2 id="wait-msg">ESPERANDO AL RIVAL...</h2>
  <div class="pulse" id="wait-dot"></div>
  <p style="color:rgba(255,255,255,0.3);font-size:0.8rem">Pide al otro jugador que abra esta misma web</p>
</div>

<!-- JUEGO -->
<div id="screen-game">
  <div id="hud">
    <div id="hud-top">
      <div class="hud-name" id="hud-top-name">JUGADOR B</div>
      <div class="hud-score" id="score-top">0</div>
    </div>
    <div id="hud-center">VS</div>
    <div id="hud-bottom" style="text-align:right">
      <div class="hud-name" id="hud-bottom-name">JUGADOR A</div>
      <div class="hud-score" id="score-bottom">0</div>
    </div>
  </div>
  <div style="position:relative;flex:1;display:flex;">
    <div class="center-line"></div>
    <canvas id="canvas"></canvas>
    <div id="pause-overlay">
      <div class="dot"></div>
      <span>SINCRONIZANDO…</span>
      <small>esperando señal del rival</small>
    </div>
  </div>
</div>

<!-- FIN -->
<div id="screen-end">
  <h2 id="end-msg">¡JUGADOR A GANA!</h2>
  <button id="btn-restart">JUGAR DE NUEVO</button>
</div>

<!-- LOG DE DEPURACIÓN (gesto secreto: 10 toques en la pantalla) -->
<div id="screen-log">
  <div id="log-header">
    <span>LOG DE DEPURACIÓN</span>
    <div id="log-actions">
      <button id="btn-log-copy">📋 COPIAR</button>
      <button id="btn-log-selectall">SELECCIONAR TODO</button>
      <button id="btn-log-close">✕ CERRAR</button>
    </div>
  </div>
  <textarea id="log-text" readonly spellcheck="false"></textarea>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ═══════════════════════════════════════════════════════════════════════
// MODELO DE RED: TRANSMISIÓN DE "RAYOS" (trayectorias completas)
// ═══════════════════════════════════════════════════════════════════════
// Un RAYO es la trayectoria total de la bola desde que sale de una paleta
// (o del saque) hasta que llega a la línea de paleta contraria, incluyendo
// TODOS los rebotes de pared por el camino (2, 3 o más). Se describe con
// una fórmula cerrada —posición inicial + velocidad CONSTANTE— y por eso
// se puede calcular de antemano, en el mismo instante en que se genera:
//   · el instante exacto (tImpact) en el que llegará a la línea de paleta
//     contraria, y la coordenada x en la que llegará (xImpact), ya
//     incluyendo el plegado de los rebotes de pared.
//   · por si acaso no hay paleta ahí, también el instante (tEdge) y la
//     x (xEdge) en las que llegaría al borde REAL de la pantalla.
// Ese único rayo se transmite UNA vez a Supabase (no un evento por cada
// rebote de pared: esos van "incluidos" en la fórmula) y ambos
// dispositivos lo "reproducen" con la misma función de teatro
// (ballPositionForRay), cada uno anclando su propio reloj local al
// instante en que empieza a reproducirlo — inmediatamente si lo generó
// él mismo, con el retraso de red correspondiente si lo ha recibido.
//
// Sólo el dispositivo hacia el que apunta el rayo (targetRole) decide algo:
// en el instante tImpact comprueba, con SU paleta local (sin red de por
// medio), si la bola cae dentro de ella. Si sí: calcula el rayo de vuelta
// y lo transmite. Si no: dice nada todavía —la propia fórmula ya lleva a
// la bola hasta el borde real— y es en tEdge cuando cuenta el gol,
// congela la bola 5s y transmite ese "rayo de gol". El otro dispositivo
// no decide nada: sólo reproduce lo que le llega.
//
// Velocidad constante DENTRO de un mismo rayo (para poder calcular el
// impacto con exactitud); la dificultad sube por CONTADOR DE TOQUES
// (cada rebote de paleta), no de forma continua en el tiempo.
// ═══════════════════════════════════════════════════════════════════════

// ── CONFIG ──────────────────────────────────────────────
const SUPABASE_URL  = 'https://rxbwfozedqipwvfhuzby.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_2G53T3tdGzdFVFYmdahPDw_65nxBsb-';
const CHANNEL_NAME  = 'pong-game-v2';

const PADDLE_W_RATIO = 0.22;   // ancho paleta relativo al canvas (x)

// ── POSICIÓN DE PALETAS EN COORDENADAS NORMALIZADAS (0-1) ──
const PADDLE_TOP_NORM = 0.05;
const PADDLE_H_NORM   = 0.017;
const INNER_TOP = PADDLE_TOP_NORM + PADDLE_H_NORM;
const INNER_BOT = 1 - INNER_TOP;

const BALL_R = 8;          // px — sólo para dibujar
const BALL_R_NORM = 0.014; // radio normalizado usado en la física del
                            // rayo — FIJO, no depende del ancho de
                            // pantalla de cada móvil, para que los
                            // rebotes de pared salgan calculados de
                            // forma IDÉNTICA en los dos dispositivos.

const SCORE_WIN = 5;

// Velocidad: constante dentro de cada rayo, sube por contador de toques.
// Ambas son las variables a tocar para ajustar la dificultad/progresión.
const BASE_SPEED = 0.35;       // unidades normalizadas / segundo, en el saque
const SPEED_PER_TOUCH = 0.06;  // incremento relativo por cada toque de paleta
const SERVE_MAX_ANGLE  = 30 * Math.PI / 180; // abanico del saque
const PADDLE_MAX_ANGLE = 60 * Math.PI / 180; // abanico del rebote en paleta,
                                              // según en qué punto golpees

// Frecuencia de transmisión de la posición de paleta: es una señal
// puramente decorativa (ver comentario en sendPaddle) que no participa en
// ningún cálculo del rayo — se deja aquí como variable ajustable para
// poder subirla o bajarla y usarla como termómetro de cuándo se satura
// Supabase, sin que afecte nunca a la física del juego.
const PADDLE_SEND_INTERVAL = 50; // ms → máx. ~20 envíos/segundo

// Seguro de sincronía: latido periódico + timeout de pausa simétrica
const HEARTBEAT_INTERVAL = 1000; // ms entre latidos
const HEARTBEAT_TIMEOUT  = 3000; // ms sin señal del rival → pausa

// Gol en el borde real: en vez de anotar en la línea de paleta, dejamos
// que el propio rayo lleve a la bola hasta el borde físico de la
// pantalla, y ahí se congela este tiempo antes de servir de nuevo.
const GOAL_FREEZE_DURATION = 5000; // ms

// ── ESTADO ──────────────────────────────────────────────
let myRole = null;        // 'adrian' | 'luis'
let channel = null;
let rivalConnected = false;

let scoreAdrian = 0;
let scoreLuis = 0;

let paddleAdrian = 0.5;
let paddleLuis   = 0.5;

// Posición visual de la bola, recalculada cada frame a partir del rayo
// actual — nunca se integra directamente, siempre sale de la fórmula.
let ball = { x: 0.5, y: 0.5 };

let gameRunning = false;

// El rayo que se está reproduciendo ahora mismo (mío o recibido) y el
// instante LOCAL (performance.now()) en el que empecé a reproducirlo en
// ESTE dispositivo — la única referencia de tiempo que usamos, así que
// nunca hace falta sincronizar relojes entre los dos móviles.
let currentRay = null;
let rayPlaybackStart = 0;

let dragging = false;
let dragStartX = 0;
let dragStartPaddle = 0;

// Seguro de sincronía
let lastHeartbeatReceived = 0;
let heartbeatTimer = null;
let connectionPaused = false;
let pauseStartedAt = null; // para descontar el tiempo de pausa del reloj del rayo al reanudar

// Reconexión automática del canal Supabase tras un CLOSED/CHANNEL_ERROR/
// TIMED_OUT — sin esto, un corte de WebSocket deja la partida pausada
// para siempre, como detectamos en el log real de una sesión.
let reconnectAttempts = 0;
let reconnectTimer = null;

// Revancha sincronizada: ambos jugadores deben pulsar "jugar de nuevo"
// antes de que arranque la bola — si no, el que pulsa antes ve la partida
// empezar sola sin que el rival esté listo.
let iWantRestart = false;
let rivalWantsRestart = false;

// Cada vez que (re)creamos el canal le asignamos un número de generación.
// Así, si un canal antiguo (ya sustituido por una reconexión) emite un
// estado tardío (p.ej. su propio CLOSED al limpiarlo), lo reconocemos como
// un eco y lo ignoramos en vez de disparar otra reconexión innecesaria.
let channelGeneration = 0;

// Modo secreto de pruebas: 5 toques en la "P" en <2s arman el modo.
// Al elegir jugador con el modo armado, ese dispositivo juega solo.
let secretTapCount = 0;
let secretTapTimer = null;
let secretModeArmed = false;
let botMode = false;

// Log de depuración: 10 toques en cualquier parte de la pantalla lo abren.
// Vive solo en memoria — se reinicia cada vez que se recarga la web.
const MAX_LOG_ENTRIES = 2000;
let logEntries = [];
let logScreenOpen = false;
let screenBeforeLog = null;
let screenTapCount = 0;
let screenTapTimer = null;

// ── LOG DE DEPURACIÓN ─────────────────────────────────────
function formatLogTime(date) {
  const hh = String(date.getHours()).padStart(2, '0');
  const mm = String(date.getMinutes()).padStart(2, '0');
  const ss = String(date.getSeconds()).padStart(2, '0');
  const ms = String(date.getMilliseconds()).padStart(3, '0');
  return `${hh}:${mm}:${ss}.${ms}`;
}

function logEvent(msg) {
  logEntries.push({ time: formatLogTime(new Date()), msg });
  if (logEntries.length > MAX_LOG_ENTRIES) logEntries.shift();
  if (logScreenOpen) renderLogText();
}

function renderLogText() {
  const ta = document.getElementById('log-text');
  if (!ta) return;
  ta.value = logEntries.map(e => `${e.time}  |  ${e.msg}`).join('\n');
  ta.scrollTop = ta.scrollHeight;
}

function getCurrentScreenId() {
  const ids = ['screen-select', 'screen-wait', 'screen-game', 'screen-end'];
  return ids.find(id => document.getElementById(id).style.display === 'flex') || 'screen-select';
}

function openLogScreen() {
  screenBeforeLog = getCurrentScreenId();
  logScreenOpen = true;
  show('screen-log');
  logEvent('— Log abierto (gesto 10 toques) —');
}

function closeLogScreen() {
  logScreenOpen = false;
  show(screenBeforeLog || 'screen-select');
}

function showLogButtonFeedback(btn, msg) {
  const original = btn.textContent;
  btn.textContent = msg;
  btn.disabled = true;
  setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
}

async function copyLogToClipboard() {
  const btn = document.getElementById('btn-log-copy');
  const text = logEntries.map(e => `${e.time}  |  ${e.msg}`).join('\n');
  // Vía moderna: portapapeles directo, sin selección manual.
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      showLogButtonFeedback(btn, '✓ COPIADO');
      return;
    }
    throw new Error('Clipboard API no disponible');
  } catch (e) {
    // Respaldo para navegadores/contextos donde falle lo anterior
    // (permiso denegado, http sin TLS, etc.): seleccionar + execCommand.
    try {
      const ta = document.getElementById('log-text');
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      showLogButtonFeedback(btn, ok ? '✓ COPIADO' : '✗ ERROR AL COPIAR');
    } catch (e2) {
      showLogButtonFeedback(btn, '✗ ERROR AL COPIAR');
    }
  }
}

document.getElementById('btn-log-close').addEventListener('click', closeLogScreen);
document.getElementById('btn-log-copy').addEventListener('click', copyLogToClipboard);
document.getElementById('btn-log-selectall').addEventListener('click', () => {
  const ta = document.getElementById('log-text');
  ta.focus();
  ta.select();
});

// Gesto global: 10 toques en cualquier parte de la pantalla (con <3s entre
// toques consecutivos) abren el log. No interfiere con el juego porque solo
// cuenta, nunca bloquea los eventos normales de arrastre/click.
function onGlobalTap() {
  if (logScreenOpen) return;
  screenTapCount++;
  clearTimeout(screenTapTimer);
  screenTapTimer = setTimeout(() => { screenTapCount = 0; }, 3000);
  if (screenTapCount >= 10) {
    screenTapCount = 0;
    clearTimeout(screenTapTimer);
    openLogScreen();
  }
}
document.addEventListener('pointerdown', onGlobalTap);

// Diagnóstico adicional: lo más probable ante un "se ha quedado
// sincronizando y no lo ha conseguido" es que el navegador móvil, al
// bloquear pantalla o pasar la app a segundo plano, congele el temporizador
// del latido y/o cierre el WebSocket de Supabase. Estos listeners lo dejan
// registrado con hora exacta para poder confirmarlo en el log.
document.addEventListener('visibilitychange', () => {
  logEvent('visibilitychange → ' + document.visibilityState);
});
window.addEventListener('online',  () => logEvent('navegador → online'));
window.addEventListener('offline', () => logEvent('navegador → OFFLINE'));
window.addEventListener('error', e => {
  logEvent('JS ERROR: ' + (e.message || e));
});
window.addEventListener('unhandledrejection', e => {
  logEvent('Promise rechazada: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});

logEvent('Página cargada');

// ── SUPABASE ─────────────────────────────────────────────
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function initChannel() {
  const myGeneration = ++channelGeneration;
  channel = sb.channel(CHANNEL_NAME, {
    config: { broadcast: { self: false } }
  });

  channel
    .on('broadcast', { event: 'presence' }, ({ payload }) => {
      logEvent('presence recibida, rol=' + payload.role);
      if (payload.role !== myRole && !rivalConnected) {
        rivalConnected = true;
        channel.send({ type: 'broadcast', event: 'presence', payload: { role: myRole } });
        onRivalJoined();
      }
    })
    .on('broadcast', { event: 'paddle' }, ({ payload }) => {
      // Puramente cosmético: sólo para dibujar la paleta del rival en mi
      // pantalla. Nunca participa en ningún cálculo del rayo — cada
      // jugador sólo comprueba el impacto contra SU PROPIA paleta local
      // — así que da igual que llegue con cierto retraso de red.
      if (payload.role === 'adrian') paddleAdrian = payload.x;
      else paddleLuis = payload.x;
    })
    .on('broadcast', { event: 'ray' }, ({ payload }) => {
      // Un rayo completo (saque, rebote de paleta, o gol), generado por
      // quien golpeó la bola. Lo adopto y empiezo a reproducirlo desde
      // ya —con MI reloj local— y, si me toca a mí (targetRole ===
      // myRole), el propio bucle principal se encargará de decidir en
      // tImpact/tEdge cuando llegue el momento.
      currentRay = { ...payload, resolved: false, missed: false, goalFinalized: false };
      rayPlaybackStart = performance.now();
      logEvent('rayo recibido objetivo=' + payload.targetRole +
        ' x0=' + payload.x0.toFixed(3) + ' y0=' + payload.y0.toFixed(3) +
        ' vx=' + payload.vx.toFixed(3) + ' vy=' + payload.vy.toFixed(3) +
        (payload.goal ? ' [GOL]' : (' tImpact=' + payload.tImpact.toFixed(2) + 's')));
      if (payload.goal) {
        setTimeout(() => {
          if (payload.willEndGame) endGame();
        }, GOAL_FREEZE_DURATION);
      }
    })
    .on('broadcast', { event: 'score' }, ({ payload }) => {
      scoreAdrian = payload.adrian;
      scoreLuis   = payload.luis;
      updateScoreUI();
      logEvent('score recibido A=' + payload.adrian + ' B=' + payload.luis);
      // El fin de partida (si procede) lo dispara el rayo de gol, pasados
      // los 5s de pausa — no aquí directamente.
    })
    .on('broadcast', { event: 'heartbeat' }, ({ payload }) => {
      const wasPaused = connectionPaused;
      lastHeartbeatReceived = performance.now();
      if (connectionPaused) resumeConnection();
      logEvent('heartbeat recibido de ' + payload.role + (wasPaused ? ' (reanuda tras pausa)' : ''));
      // Red de seguridad: si por lo que sea me he quedado sin rayo
      // (p.ej. me acabo de reconectar a media jugada y me perdí el
      // evento 'ray'), adopto el que traiga el latido, restando el
      // tiempo que ya llevaba jugándose para no reiniciarlo desde cero.
      if (payload.ray && !currentRay) {
        currentRay = { ...payload.ray, resolved: false, missed: false, goalFinalized: false };
        rayPlaybackStart = performance.now() - (payload.elapsed || 0) * 1000;
        logEvent('Rayo adoptado desde heartbeat (resync de emergencia)');
      }
    })
    .on('broadcast', { event: 'pause' }, () => {
      // El rival ha detectado un problema por su lado: nos pausamos
      // también aunque nuestra propia detección aún no haya saltado.
      logEvent('pause recibida del rival');
      triggerPause('aviso del rival');
    })
    .on('broadcast', { event: 'restart_ready' }, ({ payload }) => {
      logEvent('rival listo para revancha: ' + payload.role);
      rivalWantsRestart = true;
      tryStartRestart();
    })
    .subscribe((status) => {
      if (myGeneration !== channelGeneration) {
        // Este canal ya fue sustituido por una reconexión más reciente:
        // es un eco tardío (p.ej. su propio CLOSED al limpiarlo). Se ignora
        // para no disparar reconexiones fantasma.
        logEvent('(eco de canal antiguo #' + myGeneration + ' ignorado) → ' + status);
        return;
      }
      logEvent('canal Supabase → estado: ' + status);
      if (status === 'SUBSCRIBED') {
        reconnectAttempts = 0; // conexión sana: reiniciar el contador de reintentos
        const announce = () => {
          if (!rivalConnected) {
            channel.send({ type: 'broadcast', event: 'presence', payload: { role: myRole } });
            logEvent('presence enviada (intento)');
          }
        };
        announce();
        setTimeout(announce, 1500);
        setTimeout(announce, 3500);
        setTimeout(announce, 6000);
      } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        // El WebSocket se ha cortado por su cuenta (red, timeout del
        // servidor, etc.). Sin esto la partida se queda pausada para
        // siempre, tal como vimos en el log real de una sesión.
        if (myRole) scheduleReconnect();
      }
    });
}

// Reintenta crear y suscribir el canal con espera progresiva
// (1s, 1.5s, 2.25s… hasta un máximo de 8s), sin tocar el marcador ni
// el rol ya establecido. Espera de verdad a que el canal antiguo
// termine de limpiarse (removeChannel es asíncrono) antes de crear el
// nuevo, para no tener dos suscripciones al mismo topic solapadas.
function scheduleReconnect() {
  if (reconnectTimer) return; // ya hay un reintento programado
  const delay = Math.min(1000 * Math.pow(1.5, reconnectAttempts), 8000);
  reconnectAttempts++;
  logEvent('Reintentando conexión en ' + (delay / 1000).toFixed(1) + 's (intento ' + reconnectAttempts + ')');
  updatePauseOverlayText('reconectando… (intento ' + reconnectAttempts + ')');
  reconnectTimer = setTimeout(async () => {
    reconnectTimer = null;
    logEvent('Reconectando canal Supabase…');
    try {
      if (channel) await sb.removeChannel(channel);
    } catch (e) {
      logEvent('Aviso al limpiar canal antiguo: ' + e.message);
    }
    initChannel();
  }, delay);
}

let lastPaddleSentAt = 0;

// Sólo sirve para que el rival vea mi paleta dibujada en su pantalla —
// nunca participa en ningún cálculo del rayo (cada uno comprueba el
// impacto sólo contra su propia paleta, siempre local). Por eso da igual
// el retraso y por eso PADDLE_SEND_INTERVAL es una variable de ajuste
// "de cortesía": sirve para no saturar Supabase, no para la física.
function sendPaddle(x) {
  const now = performance.now();
  if (now - lastPaddleSentAt < PADDLE_SEND_INTERVAL) return;
  lastPaddleSentAt = now;
  channel.send({ type: 'broadcast', event: 'paddle', payload: { role: myRole, x } });
}

function sendScore() {
  channel.send({ type: 'broadcast', event: 'score',
    payload: { adrian: scoreAdrian, luis: scoreLuis } });
  logEvent('score enviado (' + myRole + ') A=' + scoreAdrian + ' B=' + scoreLuis);
}

// ── SEGURO DE SINCRONÍA (latido + pausa simétrica) ───────
function startHeartbeat() {
  if (heartbeatTimer) return;
  lastHeartbeatReceived = performance.now();
  heartbeatTimer = setInterval(() => {
    if (!channel) return;
    const payload = { role: myRole };
    if (currentRay) {
      payload.ray = currentRay;
      payload.elapsed = Math.max(0, (performance.now() - rayPlaybackStart) / 1000);
    }
    try {
      channel.send({ type: 'broadcast', event: 'heartbeat', payload });
    } catch (e) {
      logEvent('Aviso al enviar heartbeat: ' + e.message);
    }
  }, HEARTBEAT_INTERVAL);
  logEvent('heartbeat iniciado (cada ' + HEARTBEAT_INTERVAL + 'ms)');
}

function checkConnectionHealth() {
  if (!gameRunning) return;
  const silence = performance.now() - lastHeartbeatReceived;
  if (silence > HEARTBEAT_TIMEOUT) {
    triggerPause('timeout local, ' + (silence / 1000).toFixed(1) + 's sin heartbeat');
  }
}

function updatePauseOverlayText(text) {
  const el = document.querySelector('#pause-overlay small');
  if (el) el.textContent = text;
}

function triggerPause(reason) {
  if (connectionPaused) return;
  connectionPaused = true;
  pauseStartedAt = performance.now();
  document.getElementById('pause-overlay').classList.add('active');
  updatePauseOverlayText('esperando señal del rival');
  logEvent('⚠ PAUSA activada — ' + (reason || 'motivo desconocido'));
  // Avisamos al rival por si el problema es sólo en un sentido de la
  // conexión: así se para también aunque su propia detección no salte.
  try {
    if (channel) channel.send({ type: 'broadcast', event: 'pause', payload: { role: myRole } });
  } catch (e) {
    logEvent('Aviso al enviar pause: ' + e.message);
  }
}

function resumeConnection() {
  if (!connectionPaused) return;
  connectionPaused = false;
  // El reloj del rayo se ancla a performance.now(), que sigue avanzando
  // durante la pausa: sin este ajuste, al reanudar la bola "saltaría"
  // hacia delante todo lo que ha durado la pausa. Lo compensamos
  // desplazando rayPlaybackStart exactamente ese tiempo.
  if (pauseStartedAt && currentRay) {
    rayPlaybackStart += (performance.now() - pauseStartedAt);
  }
  pauseStartedAt = null;
  document.getElementById('pause-overlay').classList.remove('active');
  updatePauseOverlayText('esperando señal del rival');
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  logEvent('✓ Reanudado tras pausa');
}

// ── MODO SECRETO DE PRUEBAS ───────────────────────────────
function onSecretPTap() {
  if (secretModeArmed) return; // ya armado, no hace falta repetir
  secretTapCount++;
  clearTimeout(secretTapTimer);
  secretTapTimer = setTimeout(() => { secretTapCount = 0; }, 2000);
  if (secretTapCount >= 5) {
    secretModeArmed = true;
    clearTimeout(secretTapTimer);
    secretTapCount = 0;
    document.getElementById('secret-p').textContent = ''; // la P desaparece
    logEvent('Modo secreto de pruebas ARMADO (P oculta)');
  }
}
document.getElementById('secret-p').addEventListener('click', onSecretPTap);

// Cada frame, si el bot está activo, coloca la paleta propia exactamente
// bajo la bola (clamp igual que en el arrastre manual) y la transmite
// como si fuera un movimiento normal — el rival no nota diferencia.
function updateBot() {
  if (!botMode) return;
  const target = Math.max(PADDLE_W_RATIO / 2, Math.min(1 - PADDLE_W_RATIO / 2, ball.x));
  if (myRole === 'adrian') paddleAdrian = target;
  else paddleLuis = target;
  sendPaddle(target);
}

// ── UI ───────────────────────────────────────────────────
function show(id) {
  ['screen-select','screen-wait','screen-game','screen-end','screen-log'].forEach(s => {
    document.getElementById(s).style.display = 'none';
  });
  document.getElementById(id).style.display = 'flex';
}

function choosePlayer(role) {
  myRole = role;

  if (secretModeArmed) {
    botMode = true;
    secretModeArmed = false;
  }

  logEvent('Rol elegido: ' + role + (botMode ? ' [BOT activo]' : ''));

  if (myRole === 'adrian') {
    document.getElementById('hud-bottom-name').textContent = 'TÚ (JUG. A)';
    document.getElementById('hud-top-name').textContent    = 'JUGADOR B';
  } else {
    document.getElementById('hud-bottom-name').textContent = 'TÚ (JUG. B)';
    document.getElementById('hud-top-name').textContent    = 'JUGADOR A';
    document.getElementById('hud-top').style.color    = 'var(--adrian)';
    document.getElementById('hud-bottom').style.color = 'var(--luis)';
  }

  show('screen-wait');
  initChannel();
}

// Se llama tanto al pulsar "jugar de nuevo" como al recibir la confirmación
// del rival. Solo arranca de verdad la revancha cuando AMBOS flags están a
// true — así nadie ve la bola moverse antes de que el otro esté listo.
function tryStartRestart() {
  if (!iWantRestart || !rivalWantsRestart) return;
  iWantRestart = false;
  rivalWantsRestart = false;
  logEvent('Ambos listos — arrancando revancha');

  scoreAdrian = 0; scoreLuis = 0;
  updateScoreUI();
  currentRay = null;
  ball = { x: 0.5, y: 0.5 };
  connectionPaused = false;
  pauseStartedAt = null;
  document.getElementById('pause-overlay').classList.remove('active');
  show('screen-game');
  if (myRole === 'adrian') {
    setTimeout(() => {
      resetBallAsServer();
      gameRunning = true;
      requestAnimationFrame(loop);
    }, 300);
  } else {
    gameRunning = true;
    requestAnimationFrame(loop);
  }
}

function onRivalJoined() {
  logEvent('Rival conectado — arrancando partida');
  show('screen-game');
  resizeCanvas();
  startHeartbeat();
  if (myRole === 'adrian') {
    // Convención fija sólo para el saque inicial de la partida: alguien
    // tiene que generar el primer rayo. No afecta a la equidad del punto
    // en sí (el objetivo del saque sale a cara o cruz) — el resto de
    // saques los genera quien encaja cada gol.
    setTimeout(() => {
      resetBallAsServer();
      gameRunning = true;
      requestAnimationFrame(loop);
    }, 800);
  } else {
    gameRunning = true;
    requestAnimationFrame(loop);
  }
}

function updateScoreUI() {
  if (myRole === 'adrian') {
    document.getElementById('score-bottom').textContent = scoreAdrian;
    document.getElementById('score-top').textContent    = scoreLuis;
  } else {
    document.getElementById('score-bottom').textContent = scoreLuis;
    document.getElementById('score-top').textContent    = scoreAdrian;
  }
}

// ── CANVAS ───────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width  = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
window.addEventListener('resize', resizeCanvas);

// ── FÍSICA DEL RAYO ──────────────────────────────────────

function opponentOf(role) {
  return role === 'adrian' ? 'luis' : 'adrian';
}

// Refleja una coordenada "desplegada" (u, que puede ser cualquier real)
// dentro de [lo, hi] simulando rebotes perfectos — la misma idea que
// "doblar" una tira de papel: cada vez que se pasa de un extremo, se
// pliega hacia atrás. Con esto calculamos, en un solo paso, la posición
// x exacta de la bola aunque haya rebotado varias veces contra las
// paredes laterales, sin tener que simular rebote a rebote.
function foldX(u, lo, hi) {
  const range = hi - lo;
  const period = 2 * range;
  let m = (u - lo) % period;
  if (m < 0) m += period;
  if (m > range) m = period - m;
  return lo + m;
}

// Construye la descripción completa de un rayo: de dónde sale, con qué
// velocidad (constante) y hacia quién va, calculando de antemano tanto
// el instante/posición de llegada a la línea de paleta contraria como,
// por si no hay paleta, el instante/posición de llegada al borde real.
function buildRay(x0, y0, vx, vy, targetRole, touchCount) {
  const targetY = targetRole === 'adrian' ? INNER_BOT : INNER_TOP;
  const edgeY   = targetRole === 'adrian' ? 1 : 0;
  const tImpact = (targetY - y0) / vy;
  const xImpact = foldX(x0 + vx * tImpact, BALL_R_NORM, 1 - BALL_R_NORM);
  const tEdge   = (edgeY - y0) / vy;
  const xEdge   = foldX(x0 + vx * tEdge, BALL_R_NORM, 1 - BALL_R_NORM);
  return { x0, y0, vx, vy, targetRole, tImpact, xImpact, tEdge, xEdge, touchCount, goal: false };
}

// La "función de teatro": posición de la bola en un rayo dado, a los
// "elapsed" segundos de haber empezado a reproducirlo. Es la MISMA
// fórmula para quien generó el rayo y para quien lo recibió — sólo
// cambia el instante local (rayPlaybackStart) desde el que cada uno
// cuenta ese "elapsed".
function ballPositionForRay(ray, elapsed) {
  if (ray.goal) return { x: ray.x0, y: ray.y0 };
  const x = foldX(ray.x0 + ray.vx * elapsed, BALL_R_NORM, 1 - BALL_R_NORM);
  const y = Math.min(1, Math.max(0, ray.y0 + ray.vy * elapsed));
  return { x, y };
}

// La llama quien genera el rayo: quien saca, o quien acaba de devolver
// un golpe. Lo transmite Y empieza a reproducirlo de inmediato en su
// propio dispositivo (retraso ~0) — el rival lo recibirá con el retraso
// de red que corresponda y arrancará su propia reproducción en ese
// instante (ver el handler del evento 'ray').
function sendRay(ray) {
  channel.send({ type: 'broadcast', event: 'ray', payload: ray });
  currentRay = { ...ray, resolved: false, missed: false, goalFinalized: false };
  rayPlaybackStart = performance.now();
  logEvent('rayo enviado (' + myRole + ') objetivo=' + ray.targetRole +
    ' x0=' + ray.x0.toFixed(3) + ' y0=' + ray.y0.toFixed(3) +
    ' vx=' + ray.vx.toFixed(3) + ' vy=' + ray.vy.toFixed(3) +
    (ray.goal ? ' [GOL, fin=' + ray.willEndGame + ']' : ' tImpact=' + ray.tImpact.toFixed(2) + 's'));
}

// Saque: por convención, Jugador A lo genera el primero de cada partida;
// después, siempre lo genera quien acaba de encajar el gol. El objetivo
// (a quién de los dos va dirigido) sale a cara o cruz.
function resetBallAsServer() {
  const angle = (Math.random() * 2 - 1) * SERVE_MAX_ANGLE;
  const dir   = Math.random() < 0.5 ? 1 : -1; // cara o cruz: a quién apunta
  const vx = Math.sin(angle) * BASE_SPEED;
  const vy = Math.cos(angle) * BASE_SPEED * dir;
  const targetRole = vy > 0 ? 'adrian' : 'luis';
  sendRay(buildRay(0.5, 0.5, vx, vy, targetRole, 0));
}

// Sólo la ejecuta el dispositivo objetivo (myRole === ray.targetRole),
// exactamente en el instante tImpact calculado de antemano, comprobando
// su PROPIA paleta LOCAL — sin ninguna dependencia de red en esa
// comprobación. Si golpea, calcula el rayo de vuelta (ángulo según el
// punto de la paleta en que incide, velocidad según el nuevo contador de
// toques) y lo transmite; si no, deja constancia de que ha fallado y la
// misma reproducción del rayo se encarga de llevar la bola hasta el
// borde real (ver updateBall).
function resolveImpact(ray) {
  const myPaddle = myRole === 'adrian' ? paddleAdrian : paddleLuis;
  const pw = PADDLE_W_RATIO / 2;

  if (Math.abs(ray.xImpact - myPaddle) < pw) {
    const offset = (ray.xImpact - myPaddle) / pw; // -1..1
    const newTouch = ray.touchCount + 1;
    const speed = BASE_SPEED * (1 + newTouch * SPEED_PER_TOUCH);
    const angle = offset * PADDLE_MAX_ANGLE;
    const vyDir = myRole === 'adrian' ? -1 : 1; // rebota hacia el campo contrario
    const newVx = Math.sin(angle) * speed;
    const newVy = Math.cos(angle) * speed * vyDir;
    const startY = myRole === 'adrian' ? INNER_BOT : INNER_TOP;
    sendRay(buildRay(ray.xImpact, startY, newVx, newVy, opponentOf(myRole), newTouch));
  } else {
    ray.missed = true;
    logEvent('Fallo mi paleta (' + (myRole === 'adrian' ? 'A' : 'B') + ') — la bola sigue hasta el borde real');
  }
}

// Sólo la ejecuta el dispositivo objetivo, en el instante tEdge, y sólo
// si ya se había marcado como fallo en resolveImpact. Suma el punto para
// el rival, transmite un "rayo de gol" (congelado en el borde real) para
// que ambos vean la misma pausa, y programa el siguiente saque —que por
// convención genera quien acaba de encajar— o el fin de partida.
function finalizeGoal(ray) {
  const winnerRole = opponentOf(myRole);
  if (winnerRole === 'adrian') scoreAdrian++; else scoreLuis++;
  updateScoreUI();
  sendScore();
  logEvent('Punto para ' + (winnerRole === 'adrian' ? 'A' : 'B') +
    ' (he encajado en mi borde real) — marcador ' + scoreAdrian + '-' + scoreLuis);

  const willEndGame = scoreAdrian >= SCORE_WIN || scoreLuis >= SCORE_WIN;
  const edgeY = myRole === 'adrian' ? 1 : 0;
  sendRay({
    x0: ray.xEdge, y0: edgeY, vx: 0, vy: 0, targetRole: null,
    tImpact: 0, xImpact: ray.xEdge, tEdge: 0, xEdge: ray.xEdge,
    touchCount: 0, goal: true, willEndGame
  });

  setTimeout(() => {
    if (willEndGame) endGame();
    else resetBallAsServer(); // he encajado yo → me toca sacar
  }, GOAL_FREEZE_DURATION);
}

// Se llama una vez por frame. Decide si a mí me toca resolver algo
// (impacto o gol) en este instante y, en cualquier caso, recalcula la
// posición visual de la bola a partir del rayo actual.
function updateBall(now) {
  const ray = currentRay;
  if (!ray) return;
  const elapsed = Math.max(0, (now - rayPlaybackStart) / 1000);

  if (ray.goal) {
    ball.x = ray.x0;
    ball.y = ray.y0;
    return;
  }

  const amTarget = myRole === ray.targetRole;

  if (amTarget && !ray.resolved && elapsed >= ray.tImpact) {
    ray.resolved = true;
    resolveImpact(ray);
    return; // si hubo golpe, sendRay ya ha sustituido currentRay: el
            // siguiente frame pintará el nuevo rayo con datos frescos.
  }

  if (amTarget && ray.missed && !ray.goalFinalized && elapsed >= ray.tEdge) {
    ray.goalFinalized = true;
    finalizeGoal(ray);
    return;
  }

  const pos = ballPositionForRay(ray, elapsed);
  ball.x = pos.x;
  ball.y = pos.y;
}

// ── RENDER ───────────────────────────────────────────────
function render() {
  const W = canvas.width;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const pw = PADDLE_W_RATIO * W;

  const topColor    = myRole === 'adrian'
    ? getComputedStyle(document.documentElement).getPropertyValue('--luis').trim()
    : getComputedStyle(document.documentElement).getPropertyValue('--adrian').trim();
  const bottomColor = myRole === 'adrian'
    ? getComputedStyle(document.documentElement).getPropertyValue('--adrian').trim()
    : getComputedStyle(document.documentElement).getPropertyValue('--luis').trim();

  // Paleta de arriba en la pantalla de cada jugador = rival (cosmética)
  // Paleta de abajo = yo mismo (autoridad local)
  const topPaddleX    = myRole === 'adrian' ? paddleLuis   : paddleAdrian;
  const bottomPaddleX = myRole === 'adrian' ? paddleAdrian : paddleLuis;

  const paddleHpx = PADDLE_H_NORM * H;

  // Paleta arriba (rival)
  ctx.fillStyle = topColor;
  ctx.shadowColor = topColor;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.roundRect(topPaddleX * W - pw / 2, INNER_TOP * H - paddleHpx, pw, paddleHpx, 5);
  ctx.fill();

  // Paleta abajo (yo)
  ctx.fillStyle = bottomColor;
  ctx.shadowColor = bottomColor;
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.roundRect(bottomPaddleX * W - pw / 2, INNER_BOT * H, pw, paddleHpx, 5);
  ctx.fill();

  // Bola — Luis ve el campo al revés en Y
  const ballScreenX = ball.x * W;
  const ballScreenY = myRole === 'luis' ? (1 - ball.y) * H : ball.y * H;

  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(ballScreenX, ballScreenY, BALL_R, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
}

// ── LOOP ─────────────────────────────────────────────────
function loop(now) {
  if (!gameRunning) return;

  checkConnectionHealth();
  updateBot();
  if (!connectionPaused) {
    updateBall(now);
  }
  render();
  requestAnimationFrame(loop);
}

// ── FIN ──────────────────────────────────────────────────
function endGame() {
  if (!gameRunning) return; // ya se procesó el fin de esta partida, evita repetir
  gameRunning = false;
  const winner = scoreAdrian >= SCORE_WIN ? 'JUGADOR A' : 'JUGADOR B';
  logEvent('Fin de partida — gana ' + winner);
  document.getElementById('end-msg').textContent = `¡${winner} GANA!`;
  document.getElementById('end-msg').style.color =
    winner === 'JUGADOR A' ? 'var(--adrian)' : 'var(--luis)';
  show('screen-end');
}

// ── CONTROLES ────────────────────────────────────────────
function getCanvasX(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  return (clientX - rect.left) / rect.width;
}

canvas.addEventListener('pointerdown', e => {
  if (botMode) return;
  dragging = true;
  dragStartX = getCanvasX(e);
  dragStartPaddle = myRole === 'adrian' ? paddleAdrian : paddleLuis;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if (botMode || !dragging) return;
  const dx = getCanvasX(e) - dragStartX;
  let newX = Math.max(PADDLE_W_RATIO / 2, Math.min(1 - PADDLE_W_RATIO / 2, dragStartPaddle + dx));
  if (myRole === 'adrian') paddleAdrian = newX;
  else paddleLuis = newX;
  sendPaddle(newX);
});

canvas.addEventListener('pointerup',    () => dragging = false);
canvas.addEventListener('pointercancel',() => dragging = false);

// ── BOTONES ──────────────────────────────────────────────
document.getElementById('btn-adrian').addEventListener('click', () => choosePlayer('adrian'));
document.getElementById('btn-luis').addEventListener('click',   () => choosePlayer('luis'));

document.getElementById('btn-restart').addEventListener('click', () => {
  if (iWantRestart) return; // ya pulsado, no reenviar
  iWantRestart = true;
  logEvent('Pulsado "jugar de nuevo" — esperando confirmación del rival');
  try {
    if (channel) channel.send({ type: 'broadcast', event: 'restart_ready', payload: { role: myRole } });
  } catch (e) {
    logEvent('Aviso al enviar restart_ready: ' + e.message);
  }
  if (rivalWantsRestart) {
    tryStartRestart();
  } else {
    document.getElementById('wait-msg').textContent = 'ESPERANDO AL RIVAL PARA LA REVANCHA...';
    show('screen-wait');
  }
});
</script>
</body>
</html>
