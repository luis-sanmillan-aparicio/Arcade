<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PONG — Jugador A vs Jugador B</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;900&display=swap');

  :root {
    --bg: #0a0a0f;
    --adrian: #00ffcc;
    --luis: #ff3366;
    --ball: #ffffff;
    --dim: rgba(255,255,255,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ── PANTALLA DE SELECCIÓN ── */
  #screen-select {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  #screen-select h1 {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: clamp(2rem, 8vw, 4rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--adrian), var(--luis));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #secret-p {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  #screen-select p {
    color: rgba(255,255,255,0.4);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
  }

  .btn-players {
    display: flex;
    gap: 24px;
  }

  .btn-player {
    padding: 18px 44px;
    border: 2px solid;
    background: transparent;
    font-family: 'Orbitron', monospace;
    font-size: 1.1rem;
    font-weight: 900;
    letter-spacing: 0.15em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .btn-player::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn-player:hover::before { opacity: 0.15; }
  .btn-player:hover { transform: translateY(-2px); }

  #btn-adrian {
    border-color: var(--adrian);
    color: var(--adrian);
    text-shadow: 0 0 10px var(--adrian);
    box-shadow: 0 0 20px rgba(0,255,204,0.2);
  }
  #btn-adrian::before { background: var(--adrian); }
  #btn-adrian:hover { box-shadow: 0 0 30px rgba(0,255,204,0.5); }

  #btn-luis {
    border-color: var(--luis);
    color: var(--luis);
    text-shadow: 0 0 10px var(--luis);
    box-shadow: 0 0 20px rgba(255,51,102,0.2);
  }
  #btn-luis::before { background: var(--luis); }
  #btn-luis:hover { box-shadow: 0 0 30px rgba(255,51,102,0.5); }

  /* ── PANTALLA DE ESPERA ── */
  #screen-wait {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    text-align: center;
  }

  #screen-wait h2 {
    font-family: 'Orbitron', monospace;
    font-size: 1.4rem;
    letter-spacing: 0.15em;
  }

  .pulse {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--adrian);
    animation: pulse 1s infinite;
    margin: 0 auto;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.6); }
  }

  /* ── PANTALLA DE JUEGO ── */
  #screen-game {
    display: none;
    flex-direction: column;
    width: 100%;
    height: 100dvh;
    position: relative;
  }

  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    flex-shrink: 0;
  }

  .hud-name { font-weight: 900; font-size: 0.85rem; }
  .hud-score { font-size: 2rem; font-weight: 900; }
  #hud-top { color: var(--luis); }
  #hud-bottom { color: var(--adrian); }
  #hud-center { color: rgba(255,255,255,0.3); font-size: 0.7rem; }

  canvas {
    flex: 1;
    display: block;
    width: 100%;
    touch-action: none;
  }

  /* ── PANTALLA FIN ── */
  #screen-end {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    text-align: center;
  }

  #screen-end h2 {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: clamp(1.5rem, 6vw, 3rem);
    letter-spacing: 0.2em;
  }

  #btn-restart {
    padding: 14px 36px;
    border: 2px solid rgba(255,255,255,0.4);
    background: transparent;
    font-family: 'Orbitron', monospace;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    color: #fff;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  #btn-restart:hover {
    background: rgba(255,255,255,0.1);
    border-color: #fff;
  }

  /* línea central */
  .center-line {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: 1px;
    background: repeating-linear-gradient(90deg,
      rgba(255,255,255,0.15) 0px, rgba(255,255,255,0.15) 8px,
      transparent 8px, transparent 18px);
    pointer-events: none;
  }

  /* ── OVERLAY DE PAUSA / SEGURO DE SINCRONÍA ── */
  #pause-overlay {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: rgba(10,10,15,0.78);
    backdrop-filter: blur(2px);
    z-index: 5;
    pointer-events: none;
    text-align: center;
  }
  #pause-overlay.active { display: flex; }
  #pause-overlay .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #ffcc00;
    animation: pulse 1s infinite;
  }
  #pause-overlay span {
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    color: #ffcc00;
    text-shadow: 0 0 10px #ffcc00;
  }
  #pause-overlay small {
    color: rgba(255,255,255,0.4);
    font-size: 0.7rem;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<!-- SELECCIÓN -->
<div id="screen-select">
  <h1><span id="secret-p">P</span>ONG</h1>
  <p>¿QUIÉN ERES?</p>
  <div class="btn-players">
    <button class="btn-player" id="btn-adrian">JUGADOR A</button>
    <button class="btn-player" id="btn-luis">JUGADOR B</button>
  </div>
</div>

<!-- ESPERA -->
<div id="screen-wait">
  <h2 id="wait-msg">ESPERANDO AL RIVAL...</h2>
  <div class="pulse" id="wait-dot"></div>
  <p style="color:rgba(255,255,255,0.3);font-size:0.8rem">Pide al otro jugador que abra esta misma web</p>
</div>

<!-- JUEGO -->
<div id="screen-game">
  <div id="hud">
    <div id="hud-top">
      <div class="hud-name" id="hud-top-name">JUGADOR B</div>
      <div class="hud-score" id="score-top">0</div>
    </div>
    <div id="hud-center">VS</div>
    <div id="hud-bottom" style="text-align:right">
      <div class="hud-name" id="hud-bottom-name">JUGADOR A</div>
      <div class="hud-score" id="score-bottom">0</div>
    </div>
  </div>
  <div style="position:relative;flex:1;display:flex;">
    <div class="center-line"></div>
    <canvas id="canvas"></canvas>
    <div id="pause-overlay">
      <div class="dot"></div>
      <span>SINCRONIZANDO…</span>
      <small>esperando señal del rival</small>
    </div>
  </div>
</div>

<!-- FIN -->
<div id="screen-end">
  <h2 id="end-msg">¡JUGADOR A GANA!</h2>
  <button id="btn-restart">JUGAR DE NUEVO</button>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ── CONFIG ──────────────────────────────────────────────
const SUPABASE_URL  = 'https://rxbwfozedqipwvfhuzby.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_2G53T3tdGzdFVFYmdahPDw_65nxBsb-';
const CHANNEL_NAME  = 'pong-game-v1';

const PADDLE_W_RATIO = 0.22;   // ancho paleta relativo al canvas (x)

// ── POSICIÓN DE PALETAS EN COORDENADAS NORMALIZADAS (0-1) ──
const PADDLE_TOP_NORM = 0.05;
const PADDLE_H_NORM   = 0.017;
const INNER_TOP = PADDLE_TOP_NORM + PADDLE_H_NORM;
const INNER_BOT = 1 - INNER_TOP;

const BALL_R = 8;
const SCORE_WIN = 5;
const SPEED_INCREMENT = 0.08;  // aceleración por segundo

// Seguro de sincronía: latido periódico + timeout de pausa simétrica
const HEARTBEAT_INTERVAL = 1000; // ms entre latidos
const HEARTBEAT_TIMEOUT  = 3000; // ms sin señal del rival → pausa

// ── ESTADO ──────────────────────────────────────────────
let myRole = null;        // 'adrian' | 'luis'
let isHost = false;       // adrian es host (calcula física)
let channel = null;
let rivalConnected = false;

let scoreAdrian = 0;
let scoreLuis = 0;

let paddleAdrian = 0.5;
let paddleLuis   = 0.5;

let ball = { x: 0.5, y: 0.5, vx: 0, vy: 0 };
let gameRunning = false;
let lastTime = null;
let totalTime = 0;

let dragging = false;
let dragStartX = 0;
let dragStartPaddle = 0;

// Sincronización basada en eventos (no-host reconstruye la trayectoria)
// lastBallEvent guarda el último punto de "verdad" recibido del host
// (rebote en pared, rebote en paleta o reset) junto con el instante LOCAL
// (performance.now(), no Date.now()) en que llegó. Así evitamos cualquier
// problema de desfase de reloj entre los dos móviles: cada cliente sólo
// compara su propio reloj consigo mismo.
let lastBallEvent = null;

// Seguro de sincronía
let lastHeartbeatReceived = 0;
let heartbeatTimer = null;
let connectionPaused = false;

// Modo secreto de pruebas: 5 toques en la "P" en <2s arman el modo.
// Al elegir jugador con el modo armado, ese dispositivo juega solo.
let secretTapCount = 0;
let secretTapTimer = null;
let secretModeArmed = false;
let botMode = false;

// ── SUPABASE ─────────────────────────────────────────────
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function initChannel() {
  channel = sb.channel(CHANNEL_NAME, {
    config: { broadcast: { self: false } }
  });

  channel
    .on('broadcast', { event: 'presence' }, ({ payload }) => {
      if (payload.role !== myRole && !rivalConnected) {
        rivalConnected = true;
        channel.send({ type: 'broadcast', event: 'presence', payload: { role: myRole } });
        onRivalJoined();
      }
    })
    .on('broadcast', { event: 'paddle' }, ({ payload }) => {
      if (payload.role === 'adrian') paddleAdrian = payload.x;
      else paddleLuis = payload.x;
    })
    .on('broadcast', { event: 'ball_event' }, ({ payload }) => {
      // Sólo lo consume el no-host: nueva base exacta de extrapolación.
      // Se manda ÚNICAMENTE cuando la bola cambia de trayectoria
      // (pared, paleta o reset), no en cada frame.
      lastBallEvent = { ...payload, tLocal: performance.now() };
    })
    .on('broadcast', { event: 'score' }, ({ payload }) => {
      scoreAdrian = payload.adrian;
      scoreLuis   = payload.luis;
      updateScoreUI();
      if (payload.adrian >= SCORE_WIN || payload.luis >= SCORE_WIN) endGame();
    })
    .on('broadcast', { event: 'heartbeat' }, ({ payload }) => {
      lastHeartbeatReceived = performance.now();
      if (connectionPaused) resumeConnection();
      // El host adjunta una foto instantánea de la bola en cada latido:
      // sirve de resincronización periódica de cortesía, por si algún
      // ball_event se hubiera perdido por el camino.
      if (!isHost && payload.ball) {
        lastBallEvent = {
          x: payload.ball.x, y: payload.ball.y,
          vx: payload.ball.vx, vy: payload.ball.vy,
          totalTime: payload.ball.totalTime,
          tLocal: performance.now()
        };
      }
    })
    .on('broadcast', { event: 'pause' }, () => {
      // El rival ha detectado un problema por su lado: nos pausamos
      // también aunque nuestra propia detección aún no haya saltado.
      triggerPause();
    })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        const announce = () => {
          if (!rivalConnected) {
            channel.send({ type: 'broadcast', event: 'presence', payload: { role: myRole } });
          }
        };
        announce();
        setTimeout(announce, 1500);
        setTimeout(announce, 3500);
        setTimeout(announce, 6000);
      }
    });
}

function sendPaddle(x) {
  channel.send({ type: 'broadcast', event: 'paddle', payload: { role: myRole, x } });
}

// Sólo se llama en el HOST, y sólo en el instante exacto en que la bola
// cambia de vector (pared, paleta o reset) — no en cada frame.
function sendBallEvent() {
  channel.send({ type: 'broadcast', event: 'ball_event',
    payload: { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, totalTime } });
}

function sendScore() {
  channel.send({ type: 'broadcast', event: 'score',
    payload: { adrian: scoreAdrian, luis: scoreLuis } });
}

// ── SEGURO DE SINCRONÍA (latido + pausa simétrica) ───────
function startHeartbeat() {
  if (heartbeatTimer) return;
  lastHeartbeatReceived = performance.now();
  heartbeatTimer = setInterval(() => {
    if (!channel) return;
    const payload = isHost
      ? { role: myRole, ball: { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, totalTime } }
      : { role: myRole };
    channel.send({ type: 'broadcast', event: 'heartbeat', payload });
  }, HEARTBEAT_INTERVAL);
}

function checkConnectionHealth() {
  if (!gameRunning) return;
  if (performance.now() - lastHeartbeatReceived > HEARTBEAT_TIMEOUT) {
    triggerPause();
  }
}

function triggerPause() {
  if (connectionPaused) return;
  connectionPaused = true;
  document.getElementById('pause-overlay').classList.add('active');
  // Avisamos al rival por si el problema es sólo en un sentido de la
  // conexión: así se para también aunque su propia detección no salte.
  if (channel) channel.send({ type: 'broadcast', event: 'pause', payload: { role: myRole } });
}

function resumeConnection() {
  if (!connectionPaused) return;
  connectionPaused = false;
  document.getElementById('pause-overlay').classList.remove('active');
  lastTime = performance.now();
}

// ── MODO SECRETO DE PRUEBAS ───────────────────────────────
function onSecretPTap() {
  if (secretModeArmed) return; // ya armado, no hace falta repetir
  secretTapCount++;
  clearTimeout(secretTapTimer);
  secretTapTimer = setTimeout(() => { secretTapCount = 0; }, 2000);
  if (secretTapCount >= 5) {
    secretModeArmed = true;
    clearTimeout(secretTapTimer);
    secretTapCount = 0;
    document.getElementById('secret-p').textContent = ''; // la P desaparece
  }
}
document.getElementById('secret-p').addEventListener('click', onSecretPTap);

// Cada frame, si el bot está activo, coloca la paleta propia exactamente
// bajo la bola (clamp igual que en el arrastre manual) y la transmite
// como si fuera un movimiento normal — el rival no nota diferencia.
function updateBot() {
  if (!botMode) return;
  const target = Math.max(PADDLE_W_RATIO / 2, Math.min(1 - PADDLE_W_RATIO / 2, ball.x));
  if (myRole === 'adrian') paddleAdrian = target;
  else paddleLuis = target;
  sendPaddle(target);
}

// ── UI ───────────────────────────────────────────────────
function show(id) {
  ['screen-select','screen-wait','screen-game','screen-end'].forEach(s => {
    document.getElementById(s).style.display = 'none';
  });
  document.getElementById(id).style.display = 'flex';
}

function choosePlayer(role) {
  myRole = role;
  isHost = (role === 'adrian');

  if (secretModeArmed) {
    botMode = true;
    secretModeArmed = false;
  }

  if (myRole === 'adrian') {
    document.getElementById('hud-bottom-name').textContent = 'TÚ (JUG. A)';
    document.getElementById('hud-top-name').textContent    = 'JUGADOR B';
  } else {
    document.getElementById('hud-bottom-name').textContent = 'TÚ (JUG. B)';
    document.getElementById('hud-top-name').textContent    = 'JUGADOR A';
    document.getElementById('hud-top').style.color    = 'var(--adrian)';
    document.getElementById('hud-bottom').style.color = 'var(--luis)';
  }

  show('screen-wait');
  initChannel();
}

function onRivalJoined() {
  show('screen-game');
  resizeCanvas();
  startHeartbeat();
  if (isHost) {
    setTimeout(() => {
      hostResetBall();
      gameRunning = true;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }, 800);
  } else {
    gameRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }
}

function updateScoreUI() {
  if (myRole === 'adrian') {
    document.getElementById('score-bottom').textContent = scoreAdrian;
    document.getElementById('score-top').textContent    = scoreLuis;
  } else {
    document.getElementById('score-bottom').textContent = scoreLuis;
    document.getElementById('score-top').textContent    = scoreAdrian;
  }
}

// ── CANVAS ───────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width  = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
window.addEventListener('resize', resizeCanvas);

// ── FÍSICA (sólo host = Adrian) ──────────────────────────
function hostResetBall() {
  if (!isHost) return;
  ball.x = 0.5;
  ball.y = 0.5;
  totalTime = 0;
  const angle = (Math.random() * 60 - 30) * Math.PI / 180;
  const dir   = Math.random() < 0.5 ? 1 : -1;
  const speed = 0.35;
  ball.vx = Math.sin(angle) * speed;
  ball.vy = Math.cos(angle) * speed * dir;
  sendBallEvent();
}

function physicsStep(dt) {
  if (!isHost || !gameRunning || connectionPaused) return;

  totalTime += dt;
  const speedMult = 1 + totalTime * SPEED_INCREMENT;

  ball.x += ball.vx * dt * speedMult;
  ball.y += ball.vy * dt * speedMult;

  const W = canvas.width;
  const H = canvas.height;
  const br  = BALL_R / W;
  const brY = BALL_R / H;

  // Rebote paredes laterales — cada rebote es un evento que se emite
  if (ball.x - br < 0) {
    ball.x = br;
    ball.vx = Math.abs(ball.vx);
    sendBallEvent();
  }
  if (ball.x + br > 1) {
    ball.x = 1 - br;
    ball.vx = -Math.abs(ball.vx);
    sendBallEvent();
  }

  const pw = PADDLE_W_RATIO / 2;
  const topY    = INNER_TOP;
  const bottomY = INNER_BOT;

  // Colisión paleta superior (Luis)
  if (ball.vy < 0 && ball.y - brY < topY) {
    if (Math.abs(ball.x - paddleLuis) < pw) {
      ball.y = topY + brY;
      ball.vy = Math.abs(ball.vy);
      const offset = (ball.x - paddleLuis) / pw;
      ball.vx += offset * 0.1;
      sendBallEvent();
    } else {
      scoreAdrian++;
      updateScoreUI();
      sendScore();
      if (scoreAdrian < SCORE_WIN) hostResetBall();
      else { endGame(); return; }
    }
  }

  // Colisión paleta inferior (Adrian)
  if (ball.vy > 0 && ball.y + brY > bottomY) {
    if (Math.abs(ball.x - paddleAdrian) < pw) {
      ball.y = bottomY - brY;
      ball.vy = -Math.abs(ball.vy);
      const offset = (ball.x - paddleAdrian) / pw;
      ball.vx += offset * 0.1;
      sendBallEvent();
    } else {
      scoreLuis++;
      updateScoreUI();
      sendScore();
      if (scoreLuis < SCORE_WIN) hostResetBall();
      else { endGame(); return; }
    }
  }
}

// Reconstruye la posición actual de la bola a partir del último evento
// recibido, integrando exactamente la misma fórmula de aceleración que
// usa el host (1 + totalTime · SPEED_INCREMENT), en vez de interpolar
// una posición aproximada. Sólo lo usa el cliente no-host.
function getExtrapolatedBall(nowPerf) {
  if (!lastBallEvent) return null;
  const elapsed = Math.max(0, (nowPerf - lastBallEvent.tLocal) / 1000);
  const t0 = lastBallEvent.totalTime;
  // integral de (1 + SPEED_INCREMENT·(t0+s)) ds entre 0 y elapsed
  const dispFactor = elapsed + SPEED_INCREMENT * (t0 * elapsed + (elapsed * elapsed) / 2);
  return {
    x: lastBallEvent.x + lastBallEvent.vx * dispFactor,
    y: lastBallEvent.y + lastBallEvent.vy * dispFactor
  };
}

// ── RENDER ───────────────────────────────────────────────
function render() {
  const W = canvas.width;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // No-host: recalcular la posición de la bola por extrapolación exacta.
  // Si está en pausa por el seguro de sincronía, se congela tal cual está.
  if (!isHost && !connectionPaused) {
    const ext = getExtrapolatedBall(performance.now());
    if (ext) {
      const brX = BALL_R / W;
      ball.x = Math.min(1 - brX, Math.max(brX, ext.x));
      ball.y = ext.y;
    }
  }

  const pw = PADDLE_W_RATIO * W;

  const topColor    = myRole === 'adrian'
    ? getComputedStyle(document.documentElement).getPropertyValue('--luis').trim()
    : getComputedStyle(document.documentElement).getPropertyValue('--adrian').trim();
  const bottomColor = myRole === 'adrian'
    ? getComputedStyle(document.documentElement).getPropertyValue('--adrian').trim()
    : getComputedStyle(document.documentElement).getPropertyValue('--luis').trim();

  // Paleta de arriba en la pantalla de cada jugador = rival
  // Paleta de abajo = yo mismo
  const topPaddleX    = myRole === 'adrian' ? paddleLuis   : paddleAdrian;
  const bottomPaddleX = myRole === 'adrian' ? paddleAdrian : paddleLuis;

  const paddleHpx = PADDLE_H_NORM * H;

  // Paleta arriba (rival)
  ctx.fillStyle = topColor;
  ctx.shadowColor = topColor;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.roundRect(topPaddleX * W - pw / 2, INNER_TOP * H - paddleHpx, pw, paddleHpx, 5);
  ctx.fill();

  // Paleta abajo (yo)
  ctx.fillStyle = bottomColor;
  ctx.shadowColor = bottomColor;
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.roundRect(bottomPaddleX * W - pw / 2, INNER_BOT * H, pw, paddleHpx, 5);
  ctx.fill();

  // Bola — Luis ve el campo al revés en Y
  const ballScreenX = ball.x * W;
  const ballScreenY = myRole === 'luis' ? (1 - ball.y) * H : ball.y * H;

  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(ballScreenX, ballScreenY, BALL_R, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
}

// ── LOOP ─────────────────────────────────────────────────
function loop(now) {
  if (!gameRunning) return;
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  checkConnectionHealth();
  updateBot();
  if (!connectionPaused) {
    physicsStep(dt);
  }
  render();
  requestAnimationFrame(loop);
}

// ── FIN ──────────────────────────────────────────────────
function endGame() {
  gameRunning = false;
  const winner = scoreAdrian >= SCORE_WIN ? 'JUGADOR A' : 'JUGADOR B';
  document.getElementById('end-msg').textContent = `¡${winner} GANA!`;
  document.getElementById('end-msg').style.color =
    winner === 'JUGADOR A' ? 'var(--adrian)' : 'var(--luis)';
  show('screen-end');
}

// ── CONTROLES ────────────────────────────────────────────
function getCanvasX(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  return (clientX - rect.left) / rect.width;
}

canvas.addEventListener('pointerdown', e => {
  if (botMode) return;
  dragging = true;
  dragStartX = getCanvasX(e);
  dragStartPaddle = myRole === 'adrian' ? paddleAdrian : paddleLuis;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if (botMode || !dragging) return;
  const dx = getCanvasX(e) - dragStartX;
  let newX = Math.max(PADDLE_W_RATIO / 2, Math.min(1 - PADDLE_W_RATIO / 2, dragStartPaddle + dx));
  if (myRole === 'adrian') paddleAdrian = newX;
  else paddleLuis = newX;
  sendPaddle(newX);
});

canvas.addEventListener('pointerup',    () => dragging = false);
canvas.addEventListener('pointercancel',() => dragging = false);

// ── BOTONES ──────────────────────────────────────────────
document.getElementById('btn-adrian').addEventListener('click', () => choosePlayer('adrian'));
document.getElementById('btn-luis').addEventListener('click',   () => choosePlayer('luis'));

document.getElementById('btn-restart').addEventListener('click', () => {
  scoreAdrian = 0; scoreLuis = 0;
  updateScoreUI();
  lastBallEvent = null;
  connectionPaused = false;
  document.getElementById('pause-overlay').classList.remove('active');
  show('screen-game');
  if (isHost) {
    setTimeout(() => {
      hostResetBall();
      gameRunning = true;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }, 300);
  } else {
    gameRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }
});
</script>
